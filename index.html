<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程评价系统</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">课程评价</div>
        <img alt="用户头像" class="user-avatar" id="userAvatar">
    </header>
    
    <!-- 搜索区域 -->
    <div class="search-container">
        <div class="search-tabs">
            <div class="search-tab active" data-type="course">按课程名称</div>
            <div class="search-tab" data-type="teacher">按教师名称</div>
        </div>
        <input type="text" class="search-input" placeholder="搜索课程..." id="searchInput">
    </div>
    
    <!-- 主要内容区域 -->
    <div class="container">
        <!-- 左侧筛选栏 -->
        <div class="sidebar" id="sidebarFilters">
            <!-- 筛选条件将通过JS动态加载 -->
            <div class="filter-section">
                <div class="filter-title">学院</div>
                <div id="departmentFilters">
                    <!-- 部门筛选选项将通过JS动态加载 -->
                </div>
            </div>
            
            <div class="filter-section">
                <div class="filter-title">评分范围</div>
                <div id="ratingFilters">
                    <!-- 评分筛选选项将通过JS动态加载 -->
                </div>
            </div>
            
            <div class="filter-section">
                <div class="filter-title">学分</div>
                <div id="creditFilters">
                    <!-- 学分筛选选项将通过JS动态加载 -->
                </div>
            </div>
        </div>
        
        <!-- 课程内容区域 -->
        <div class="content" id="courseList">
            <!-- 课程卡片将通过JS动态加载 -->
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <!-- 浮动按钮 -->
    <div class="float-button" id="floatButton">
        <i>+</i>
    </div>
    
    <script type="module" src="js/index.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/api.js"></script>
</body>
</html>
