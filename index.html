<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程评价系统</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">课程评价</div>
        <img alt="用户头像" class="user-avatar" id="userAvatar">
    </header>
    
    <!-- 搜索区域 -->
    <div class="search-container">
        <div class="search-tabs">
            <div class="search-tab active" data-type="reviews">搜索评价</div>
            <div class="search-tab" data-type="courses">搜索课程</div>
        </div>
        <input type="text" class="search-input" placeholder="搜索课程..." id="searchInput">
    </div>
    
    <!-- 主要内容区域 -->
    <div class="container">
        <!-- 左侧筛选栏 -->
        <div class="sidebar" id="sidebarFilters">
            <!-- 筛选条件将通过JS动态加载 -->
            <div class="filter-section">
                <div class="filter-title">学院</div>
                <div id="departmentFilters">
                    <!-- 部门筛选选项将通过JS动态加载 -->
                </div>
            </div>
            
            <!-- 评分范围筛选选项 -->
<div class="filter-section">
    <div class="filter-title">评分范围</div>
    <div id="ratingFilters">
        <!-- 修改为使用min-max格式 -->
        <div class="filter-option">
            <input type="radio" id="rating-none" value="" name="rating" checked>
            <label for="rating-none">不限</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="rating-4-5" value="4-5" name="rating">
            <label for="rating-4-5">4-5星</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="rating-3-4" value="3-4" name="rating">
            <label for="rating-3-4">3-4星</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="rating-2-3" value="2-3" name="rating">
            <label for="rating-2-3">2-3星</label>
        </div>
        <div class="filter-option">
            <input type="radio" id="rating-1-2" value="1-2" name="rating">
            <label for="rating-1-2">1-2星</label>
        </div>
    </div>
</div>
            
            <div class="filter-section">
                <div class="filter-title">学分</div>
                <div id="creditFilters">
                    <!-- 学分筛选选项将通过JS动态加载 -->
                </div>
            </div>
        </div>
        
        <!-- 课程内容区域 -->
        <div class="content" id="courseList">
            <!-- 课程卡片将通过JS动态加载 -->
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <!-- 浮动按钮 -->
    <div class="float-button" id="floatButton">
        <i>+</i>
    </div>
    
    <script type="module" src="js/index.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/api.js"></script>
</body>
</html>
