<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程详情</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        .course-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .course-header {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f1f3f5;
        }
        
        .course-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--dark-color);
            font-weight: 700;
            line-height: 1.2;
        }
        
        .course-meta {
            color: var(--gray-color);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: flex;
            gap: 1rem;
        }
        
        .course-stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            min-width: 120px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.25rem;
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--gray-color);
            font-weight: 500;
        }
        
        .reviews-section {
            margin-top: 2.5rem;
        }
        
        .reviews-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--dark-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .reviews-section h2::before {
            content: "✎";
            color: var(--primary-color);
            font-size: 1.25rem;
        }
        
        .review-item {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--box-shadow);
            position: relative;
            overflow: hidden;
        }

        .review-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--primary-color);
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .review-user {
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .review-user img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .review-date {
            color: var(--gray-color);
            font-size: 0.875rem;
        }
        
        .review-rating {
            color: var(--warning-color);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .review-content {
            margin-top: 1rem;
            line-height: 1.6;
            color: var(--dark-color);
        }

        .review-meta {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .review-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--gray-color);
        }

        .review-meta-item span {
            font-weight: 500;
            color: var(--dark-color);
        }
        
        .review-form {
            margin-top: 2.5rem;
            padding: 1.5rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 500;
            color: var(--dark-color);
        }
        
        .rating-input {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .rating-input select {
            padding: 0.5rem 0.75rem;
            border-radius: var(--border-radius);
            border: 1px solid #dee2e6;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .rating-input select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            border-radius: var(--border-radius);
            min-height: 120px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            background-color: var(--secondary-color);
        }
        
        .error-message {
            color: var(--danger-color);
            margin-top: 1rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message::before {
            content: "⚠";
        }

        .no-reviews {
            text-align: center;
            padding: 2rem;
            color: var(--gray-color);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .course-container {
                padding: 0 1rem;
            }
            
            .course-title {
                font-size: 1.75rem;
            }
            
            .stat-item {
                min-width: 100px;
                padding: 1rem;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 576px) {
            .course-title {
                font-size: 1.5rem;
            }
            
            .course-meta {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .course-stats {
                gap: 1rem;
            }
            
            .stat-item {
                min-width: calc(50% - 0.5rem);
                padding: 0.75rem;
            }
            
            .stat-value {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <!-- 现代化顶部导航栏 -->
    <header class="header">
        <div class="logo">课程详情</div>
        <img alt="用户头像" class="user-avatar" id="userAvatar">
    </header>
    
    <!-- 主要内容区域 -->
    <div class="course-container">
        <div class="course-header">
            <h1 class="course-title" id="courseTitle">课程名称</h1>
            <div class="course-meta">
                <span id="courseDepartment">学院</span> · 
                <span id="courseCredit">学分</span>学分
            </div>
            
            <div class="course-stats">
                <div class="stat-item">
                    <div class="stat-value" id="avgRating">0.0</div>
                    <div class="stat-label">平均评分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="reviewCount">0</div>
                    <div class="stat-label">评价数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgDifficulty">0.0</div>
                    <div class="stat-label">平均难度</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgGrading">0.0</div>
                    <div class="stat-label">平均给分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgHarvest">0.0</div>
                    <div class="stat-label">平均收获</div>
                </div>
            </div>
        </div>
        
        <!-- 课程评价 -->
        <div class="reviews-section">
            <h2>课程评价</h2>
            
            <div id="reviewsList">
                <!-- 评价列表将通过JS动态加载 -->
                <div class="loading">加载中...</div>
            </div>
            
            <!-- 评价表单 (仅登录用户可见) -->
            <div id="reviewFormContainer" class="review-form" style="display: none;">
                <h3>发表评价</h3>
                <form id="reviewForm">
                    <div class="form-group">
                        <label>评分</label>
                        <div class="rating-input">
                            <select id="rating" required>
                                <option value="">请选择</option>
                                <option value="1">1星</option>
                                <option value="2">2星</option>
                                <option value="3">3星</option>
                                <option value="4">4星</option>
                                <option value="5">5星</option>
                            </select>
                            <span class="rating-hint">(5星为最高)</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>难度 (1-5分，1表示非常简单)</label>
                        <div class="rating-input">
                            <select id="difficulty" required>
                                <option value="">请选择</option>
                                <option value="1">1分</option>
                                <option value="2">2分</option>
                                <option value="3">3分</option>
                                <option value="4">4分</option>
                                <option value="5">5分</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>给分情况 (1-5分，1表示给分严格)</label>
                        <div class="rating-input">
                            <select id="grading" required>
                                <option value="">请选择</option>
                                <option value="1">1分</option>
                                <option value="2">2分</option>
                                <option value="3">3分</option>
                                <option value="4">4分</option>
                                <option value="5">5分</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>收获程度 (1-5分，1表示收获很小)</label>
                        <div class="rating-input">
                            <select id="harvest" required>
                                <option value="">请选择</option>
                                <option value="1">1分</option>
                                <option value="2">2分</option>
                                <option value="3">3分</option>
                                <option value="4">4分</option>
                                <option value="5">5分</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">详细评价</label>
                        <textarea id="content" required placeholder="请分享您对这门课程的真实感受..."></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">提交评价</button>
                    <div id="formError" class="error-message"></div>
                </form>
            </div>
        </div>
    </div>
    
    <script type="module" src="js/course.js"></script>
</body>
</html>
