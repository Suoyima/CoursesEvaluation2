<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>撰写评价</title>
    <link rel="stylesheet" href="css/review.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
    <!-- 现代化顶部导航栏 -->
    <header class="header">
        <div class="logo">撰写评价</div>
        <img alt="用户头像" class="user-avatar" id="userAvatar">
    </header>
    
    <!-- 主要内容区域 -->
    <div class="review-container">
        <div class="review-header">
            <a href="index.html" class="back-link">返回</a>
            <h1>撰写课程评价</h1>
        </div>
        
        <!-- 表单区域 -->
        <div class="form-section">
            <h2>选择课程</h2>
            
            <div class="search-box">
                <input type="text" id="courseSearch" placeholder="搜索课程名称或代码...">
                <div class="course-results" id="courseResults"></div>
            </div>
            
            <div class="selected-course" id="selectedCourse">
                <strong>已选课程:</strong> <span id="selectedCourseName"></span>
            </div>
        </div>
        
        <div class="form-section">
            <h2>评价内容</h2>
            
            <div class="rating-item">
                <label>课程评分</label>
                <div class="star-rating" id="starRating">
                    <span data-rating="1">☆</span>
                    <span data-rating="2">☆</span>
                    <span data-rating="3">☆</span>
                    <span data-rating="4">☆</span>
                    <span data-rating="5">☆</span>
                </div>
                <input type="hidden" id="ratingValue" value="0">
            </div>
            
            <div class="rating-item">
                <label for="difficulty">课程难度 (1-5分，1表示非常简单)</label>
                <div class="number-rating">
                    <input type="number" id="difficulty" min="1" max="5" placeholder="输入1-5的评分">
                </div>
            </div>
            
            <div class="rating-item">
                <label for="grading">给分情况 (1-5分，1表示给分严格)</label>
                <div class="number-rating">
                    <input type="number" id="grading" min="1" max="5" placeholder="输入1-5的评分">
                </div>
            </div>
            
            <div class="rating-item">
                <label for="harvest">收获程度 (1-5分，1表示收获很小)</label>
                <div class="number-rating">
                    <input type="number" id="harvest" min="1" max="5" placeholder="输入1-5的评分">
                </div>
            </div>
            
            <div class="form-group">
                <label for="content">详细评价</label>
                <textarea id="content" placeholder="请分享您对这门课程的真实感受..."></textarea>
            </div>
            
            <button class="submit-btn" id="submitReview">提交评价</button>
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>
    
    <script type="module" src="js/review.js"></script>
</body>
</html>
