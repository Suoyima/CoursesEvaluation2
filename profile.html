<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 课程评价系统</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f1f3f5;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1.5rem;
            display: block;
            background-color: #f0f0f0;
            border: 4px solid white;
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }
        
        .profile-avatar:hover {
            transform: scale(1.05);
        }
        
        #userName {
            font-size: 1.75rem;
            color: var(--dark-color);
            font-weight: 700;
            margin: 0.5rem 0;
        }
        
        .profile-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .profile-section h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--dark-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .profile-section h2::before {
            content: "⚙";
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark-color);
            font-size: 0.9rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            border: 1px solid #dee2e6;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
        }
        
        .btn-primary:hover {
            background-color: var(--secondary-color);
        }
        
        .stats-container {
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .stat-item {
            background: white;
            padding: 1rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            min-width: 120px;
            transition: var(--transition);
        }

        .stat-item:hover {
            transform: translateY(-3px);
        }
        
        .stat-value {
            font-size: 1.75rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.25rem;
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--gray-color);
            font-weight: 500;
        }
        
        .error-message {
            color: var(--danger-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .error-message::before {
            content: "⚠";
        }
        
        .success-message {
            color: var(--success-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .success-message::before {
            content: "✓";
        }

        @media (max-width: 768px) {
            .profile-container {
                padding: 0 1rem;
            }
            
            #userName {
                font-size: 1.5rem;
            }
            
            .profile-avatar {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 576px) {
            .stat-item {
                min-width: calc(50% - 0.5rem);
                padding: 0.75rem;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 现代化顶部导航栏 -->
    <header class="header">
        <div class="logo">个人中心</div>
        <img alt="用户头像" class="user-avatar" id="userAvatar">
    </header>
    
    <!-- 主要内容区域 -->
    <div class="profile-container">
        <div class="profile-header">
            <img alt="用户头像" class="profile-avatar" id="userAvatarLarge">
            <h1 id="userName">用户名</h1>
        </div>
        
        <!-- 用户统计信息 -->
        <div class="profile-section">
            <h2>我的统计</h2>
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-value" id="reviewsCount">0</div>
                    <div class="stat-label">评价数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgRating">0.0</div>
                    <div class="stat-label">平均评分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="helpfulCount">0</div>
                    <div class="stat-label">有帮助评价</div>
                </div>
            </div>
        </div>
        
        <!-- 基本信息编辑 -->
        <div class="profile-section">
            <h2>基本信息</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label for="name">昵称</label>
                    <input type="text" id="name" class="form-control">
                </div>
                <div class="form-group">
                    <label for="avatar">头像URL</label>
                    <input type="text" id="avatar" class="form-control" placeholder="输入图片URL地址">
                </div>
                <div id="profileError" class="error-message"></div>
                <div id="profileSuccess" class="success-message"></div>
                <button type="submit" class="btn-primary">保存更改</button>
            </form>
        </div>
        
        <!-- 修改密码 -->
        <div class="profile-section">
            <h2>修改密码</h2>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="oldPassword">当前密码</label>
                    <input type="password" id="oldPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                </div>
                <div id="passwordError" class="error-message"></div>
                <div id="passwordSuccess" class="success-message"></div>
                <button type="submit" class="btn-primary">修改密码</button>
            </form>
        </div>
    </div>
    
    <script type="module" src="js/profile.js"></script>
</body>
</html>
