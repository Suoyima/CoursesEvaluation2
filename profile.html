<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 课程评价系统</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: white;
            min-height: 100vh;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            background-color: #f0f0f0;
            border: 2px solid #ddd;
        }
        
        .profile-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
        }
        
        .profile-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #24292e;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
        }
        
        .btn-primary {
            background-color: #2ea44f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-primary:hover {
            background-color: #2c974b;
        }
        
        .stats-container {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        
        .stat-item {
            padding: 10px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #0366d6;
        }
        
        .stat-label {
            font-size: 14px;
            color: #586069;
        }
        
        .error-message {
            color: #cb2431;
            font-size: 13px;
            margin-top: 5px;
        }
        
        .success-message {
            color: #2ea44f;
            font-size: 13px;
            margin-top: 5px;
        }
        
        #userName {
            font-size: 1.5rem;
            color: #333;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">个人中心</div>
    </header>
    
    <!-- 主要内容区域 -->
    <div class="profile-container">
        <div class="profile-header">
            <img alt="用户头像" class="profile-avatar" id="userAvatarLarge">
            <h1 id="userName">用户名</h1>
        </div>
        
        <!-- 用户统计信息 -->
        <div class="profile-section">
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-value" id="reviewsCount">0</div>
                    <div class="stat-label">评价数量</div>
                </div>
            </div>
        </div>
        
        <!-- 基本信息编辑 -->
        <div class="profile-section">
            <h2>基本信息</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label for="name">昵称</label>
                    <input type="text" id="name" class="form-control">
                </div>
                <div class="form-group">
                    <label for="avatar">头像URL</label>
                    <input type="text" id="avatar" class="form-control" placeholder="输入图片URL地址">
                </div>
                <div id="profileError" class="error-message"></div>
                <div id="profileSuccess" class="success-message"></div>
                <button type="submit" class="btn-primary">保存更改</button>
            </form>
        </div>
        
        <!-- 修改密码 -->
        <div class="profile-section">
            <h2>修改密码</h2>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="oldPassword">当前密码</label>
                    <input type="password" id="oldPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                </div>
                <div id="passwordError" class="error-message"></div>
                <div id="passwordSuccess" class="success-message"></div>
                <button type="submit" class="btn-primary">修改密码</button>
            </form>
        </div>
    </div>
    
    <script type="module" src="js/profile.js"></script>
</body>
</html>
